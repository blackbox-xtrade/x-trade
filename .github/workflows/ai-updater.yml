name: AI Auto-Trade Analyst

on:
  schedule:
    - cron: '0 0 * * *' # Menjalankan setiap jam 00:00 UTC (07:00 WIB)
  workflow_dispatch: # Memungkinkan kita menjalankan manual dari tombol di GitHub

jobs:
  update-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run AI Analyst Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_web.py

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 AI Update: Sinyal XAUUSD harian terbaru" && git push)
